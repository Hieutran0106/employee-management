<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Employee List</title>
</head>

<body>

    <h1>Employee List</h1>

    <a th:href="@{/employees/add}">
        Add Employee
    </a>

    &nbsp; | &nbsp;

    <a th:href="@{/employees/search-page}">
        Search Employees
    </a>

    <br>
    <br>

    <table border="1">

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="employee : ${employees}">

                <td th:text="${employee.id}">
                </td>

                <td th:text="${employee.name}">
                </td>

                <td th:text="${employee.email}">
                </td>

                <td
                    th:text="${employee.department != null
                        ? employee.department.name
                        : 'N/A'}">
                </td>

            </tr>

        </tbody>

    </table>

</body>
</html>
